name: Swift

# Build-only: the test suite talks to a local json-server (Node) fixture, which
# isn't provisioned here. CI guards against compile/toolchain regressions on
# both the Linux (FoundationNetworking) and Apple code paths.

on: [push]

jobs:
  linux:
    name: Swift ${{ matrix.swift }} on Linux
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.2"]
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build

  macos:
    name: Swift (Xcode) on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
