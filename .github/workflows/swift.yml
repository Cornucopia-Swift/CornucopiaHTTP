name: Swift

# Build-only: the test suite talks to a local json-server (Node) fixture, which
# isn't provisioned here. macOS-only: the progress code uses Apple-Foundation's
# Progress(totalUnitCount:), absent from swift-corelibs-foundation, so it does
# not currently build on Linux.

on: [push]

jobs:
  macos:
    name: Swift (Xcode) on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show Swift version
        run: swift --version
      - name: Build
        run: swift build
